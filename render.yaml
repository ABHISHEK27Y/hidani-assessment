services:
  - type: web
    name: orbit-assessment
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: orbit-assessment-db
          property: connectionString
      - key: LLM_PROVIDER
        value: gemini
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: GEMINI_API_KEY
        sync: false
      - key: APPLICATION_MODE
        value: assisted

databases:
  - name: orbit-assessment-db
    plan: free
    databaseName: orbit_assessment
